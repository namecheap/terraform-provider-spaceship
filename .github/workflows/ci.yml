name: CI

# No workflow-level paths-ignore here, on purpose. If this workflow does not
# trigger at all, two things break: (1) required status checks are never
# reported on PRs that touch only excluded files, which blocks them from
# merging permanently, and (2) versioning.yml's `workflow_run: [CI]` trigger
# never fires on pushes that touch only release files, stalling the
# release-please -> tag -> GoReleaser chain. Instead, the `changes` job below
# detects what changed and the expensive jobs skip themselves via `if:` —
# skipped checks DO satisfy branch protection, and the workflow still
# completes so workflow_run still fires. See CI.md.
on:
    push:
        branches:
            - master
    pull_request:

# Least-privilege default: CI only reads the repo. Codecov uses its own token
# (CODECOV_TOKEN secret), and upload-artifact does not require write perms.
permissions:
    contents: read

jobs:
    # Gate job: decides whether the jobs below actually need to run for this
    # change. `code` is false only when the diff touches nothing but
    # root-level markdown (README/CHANGELOG/CLAUDE.md/...), LICENSE, or the
    # release-please manifest — most notably the release-please Release PR
    # (CHANGELOG.md + .release-please-manifest.json) and its merge to master,
    # which previously re-ran the full acceptance suite twice per release on
    # code that was already tested. docs/** and templates/** deliberately
    # count as code: docs/ is published to the Terraform Registry at each
    # release tag, so doc changes get the full pipeline like any user-visible
    # change.
    changes:
        name: Detect Changes
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: read # paths-filter reads PR files via the API on pull_request events
        outputs:
            code: ${{ steps.filter-code.outputs.code }}
        steps:
            # Checkout is required for push events, where paths-filter diffs
            # with git (pull_request events use the API and would not need it).
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            # With predicate-quantifier=every a file counts as `code` only if
            # it matches ALL patterns, i.e. it is none of the ignored kinds.
            # `*.md` (no globstar) matches root-level markdown only, so nested
            # markdown — docs/**, templates/** — still counts as code on
            # purpose.
            - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
              id: filter-code
              with:
                  predicate-quantifier: "every"
                  filters: |
                      code:
                          - '!*.md'
                          - '!LICENSE'
                          - '!.release-please-manifest.json'

    check:
        name: Check
        runs-on: ubuntu-latest
        needs: changes
        if: needs.changes.outputs.code == 'true'
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Set up Go
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version-file: go.mod
                  check-latest: true

            - name: Lint
              uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
              with:
                  version: v2.11

            - name: Set up Terraform
              uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
              with:
                  terraform_wrapper: false

            - name: Unit Test with Coverage
              run: make test-cover

            - name: Check Coverage Threshold
              run: |
                  COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
                  echo "Total coverage: ${COVERAGE}%"
                  # Client/API logic moved to github.com/namecheap/go-spaceship-sdk, where it
                  # is unit-tested and gated separately. This floor reflects provider-only code;
                  # the record validator wrappers are covered by acceptance tests, not unit tests.
                  THRESHOLD=35.0
                  if [ "$(echo "${COVERAGE} < ${THRESHOLD}" | bc -l)" -eq 1 ]; then
                      echo "::error::Coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
                      exit 1
                  fi

            - name: Upload Coverage Report
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: coverage-report
                  path: coverage.out
                  retention-days: 30

            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
              with:
                  files: coverage.out
                  token: ${{ secrets.CODECOV_TOKEN }}
                  fail_ci_if_error: false

            # Two separate checks on the autogenerated docs/ tree:
            #   1. Drift check — regenerate from the provider schema and diff
            #      against what's committed. Catches PRs that change schema
            #      but forget to run `make docs`.
            #   2. Schema check — `tfplugindocs validate` lints the structure
            #      of the docs files themselves (front-matter, required
            #      sections, etc.). It does not detect drift.
            # `tfplugindocs` has no single command that does both.
            - name: Check docs are up-to-date and well-formed
              run: |
                  make docs
                  if ! git diff --exit-code docs/; then
                      echo "❌ Documentation is out of sync with provider code!"
                      echo "Please run 'make docs' locally and commit the changes."
                      echo ""
                      echo "Changed files:"
                      git diff --name-only docs/
                      echo ""
                      echo "Diff:"
                      git diff docs/
                      exit 1
                  fi
                  make docs-validate

    security:
        # Trivy covers four concerns in one job: SCA (CVEs in Go dependencies),
        # IaC misconfig (Terraform / YAML), committed secrets, and license
        # policy. A separate step emits a CycloneDX SBOM artifact so downstream
        # tooling can consume an inventory without re-running the scan.
        name: Security scan (Trivy)
        runs-on: ubuntu-latest
        needs: changes
        if: needs.changes.outputs.code == 'true'
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Trivy vuln + misconfig + secret + license scan
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
              with:
                  # Pin the Trivy binary to a specific scanner release rather than
                  # the action's bundled default, so scan behavior is reproducible.
                  # Dependabot bumps the action SHA but NOT this input — bump by
                  # hand after reviewing https://github.com/aquasecurity/trivy/releases.
                  version: v0.71.1
                  scan-type: fs
                  scan-ref: .
                  scanners: vuln,misconfig,secret,license
                  severity: CRITICAL,HIGH
                  ignore-unfixed: true
                  exit-code: "1"
                  format: table
                  # License denylist lives in trivy.yaml at the repo root; the
                  # action auto-loads it before each scanner runs.
                  trivy-config: trivy.yaml
                  cache: "true"

            - name: Trivy report (JSON, all severities, non-gating)
              # Second Trivy pass that NEVER gates (exit-code 0) and drops the
              # CRITICAL,HIGH + ignore-unfixed filters of the gating scan above,
              # so the PR summary can show the full picture (medium/low + unfixed).
              # Consumed only by the security-report job.
              if: ${{ !cancelled() }}
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
              with:
                  version: v0.71.1
                  scan-type: fs
                  scan-ref: .
                  scanners: vuln,misconfig,secret,license
                  exit-code: "0"
                  format: json
                  output: trivy-results.json
                  trivy-config: trivy.yaml
                  cache: "true"

            - name: Upload Trivy JSON report
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: trivy-json
                  path: trivy-results.json
                  retention-days: 90

            - name: Generate CycloneDX SBOM
              # Runs even if the gating scan found HIGH/CRITICAL — the SBOM is a
              # static inventory and should be produced regardless of gating.
              if: ${{ !cancelled() }}
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
              with:
                  version: v0.71.1
                  scan-type: fs
                  scan-ref: .
                  format: cyclonedx
                  output: sbom.cdx.json
                  cache: "true"

            - name: Upload SBOM artifact
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: sbom-cyclonedx
                  path: sbom.cdx.json
                  retention-days: 90

    govulncheck:
        # Go-native reachability gate, complementary to Trivy's SCA scan. It
        # fails only when a vulnerable symbol is actually reachable from this
        # module's code (call-graph analysis against https://vuln.go.dev plus the
        # stdlib for the toolchain in use), keeping the gate low-noise while still
        # catching exploitable stdlib CVEs that a version-range scan misses. The
        # advisory DB is fetched fresh each run.
        name: Security scan (govulncheck)
        runs-on: ubuntu-latest
        needs: changes
        if: needs.changes.outputs.code == 'true'
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up Go
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version-file: go.mod
                  check-latest: true

            - name: Run govulncheck
              # Pin the binary so a release can't silently change scan behavior.
              # Installed via `go install` (not in go.mod, so out of the module
              # graph + SBOM) — bump by hand after reviewing
              # https://github.com/golang/vuln/releases. Exit code 3 (a vuln in
              # CALLED code) fails the job; imported-but-uncalled findings don't.
              run: |
                  go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
                  govulncheck ./...

            - name: govulncheck JSON report (non-gating)
              # Re-run in JSON purely to feed the PR summary; never gates (|| true).
              # The text run above stays the authoritative gate. Invoked by
              # absolute path in case GOPATH/bin isn't on PATH for this step.
              if: ${{ !cancelled() }}
              run: |
                  GOVULNCHECK="$(go env GOPATH)/bin/govulncheck"
                  "$GOVULNCHECK" -format json ./... > govulncheck.json || true

            - name: Upload govulncheck JSON report
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: govulncheck-json
                  path: govulncheck.json
                  retention-days: 90

    security-report:
        # Consolidates every security scan into ONE Markdown report, posted as a
        # sticky PR comment (the visibility goal), the run's job summary, and the
        # `security-summary` artifact. REPORTING ONLY — it never gates. Per-scan
        # pass/fail is taken verbatim from the gate jobs (needs.*.result), so a
        # green comment can never mask a red gate.
        name: Security scan summary
        needs: [changes, security, govulncheck]
        # Run even when a scan above failed — that's when the summary matters
        # most. `!cancelled()` alone would also run when the `changes` gate
        # skipped the scans (status-check functions override the implicit
        # success() on needs), so the gate output is re-checked explicitly.
        if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
        runs-on: ubuntu-latest
        permissions:
            contents: read # checkout + read go.mod for the dependency overview
            pull-requests: write # post/update the sticky summary comment
            security-events: read # read open CodeQL alerts to enrich the summary
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Download scan artifacts
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  path: scan-artifacts
                  merge-multiple: true

            - name: Fetch open CodeQL alerts (best effort)
              # The CodeQL workflow (codeql.yml) runs separately; its open alerts
              # for this ref are pulled via the API only to enrich the summary.
              # Never fails the job — a not-yet-complete analysis just yields [].
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh api "repos/${GITHUB_REPOSITORY}/code-scanning/alerts?ref=${GITHUB_REF}&state=open&per_page=100" \
                      > scan-artifacts/codeql-alerts.json 2>/dev/null || echo '[]' > scan-artifacts/codeql-alerts.json

            - name: Build security summary
              env:
                  SECURITY_RESULT: ${{ needs.security.result }}
                  GOVULNCHECK_RESULT: ${{ needs.govulncheck.result }}
                  COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
                  BRANCH: ${{ github.head_ref || github.ref_name }}
              run: |
                  bash scripts/security-summary.sh \
                      scan-artifacts/trivy-results.json \
                      scan-artifacts/govulncheck.json \
                      scan-artifacts/sbom.cdx.json \
                      go.mod \
                      scan-artifacts/codeql-alerts.json \
                      > security-summary.md
                  cat security-summary.md >> "$GITHUB_STEP_SUMMARY"

            - name: Upload summary artifact
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: security-summary
                  path: security-summary.md
                  retention-days: 90

            - name: Post or update PR comment
              # Only for PRs from a branch in THIS repo. Fork PRs get a read-only
              # GITHUB_TOKEN (commenting would 403), so skip them — the job
              # summary + artifact above are still produced. A sticky marker keeps
              # it to one comment that updates in place instead of one per push.
              if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
              env:
                  GH_TOKEN: ${{ github.token }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
              run: |
                  set -uo pipefail
                  marker='<!-- security-scan-summary -->'
                  existing="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
                                --jq "map(select(.body | startswith(\"${marker}\"))) | .[0].id // empty")"
                  jq -Rs '{body: .}' security-summary.md > comment-payload.json
                  if [ -n "${existing}" ]; then
                      gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" \
                          --input comment-payload.json >/dev/null
                      echo "Updated existing summary comment #${existing} on PR #${PR_NUMBER}."
                  else
                      gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
                          --input comment-payload.json >/dev/null
                      echo "Posted new summary comment on PR #${PR_NUMBER}."
                  fi

    acceptance:
        name: Acceptance Tests
        needs: [changes, check]
        # The implicit success() still applies alongside this expression, so
        # the job keeps requiring `check` to pass. The acceptance-secrets
        # probe stays step-level (see below): when secrets are absent (fork /
        # Dependabot PRs) the job still runs and passes with all steps
        # skipped, exactly as before.
        if: needs.changes.outputs.code == 'true'
        runs-on: ubuntu-latest
        concurrency:
            group: acceptance-tests
            cancel-in-progress: false
        steps:
            - name: Check Acceptance Secrets
              id: acc_secrets
              env:
                  SPACESHIP_API_KEY: ${{ secrets.SPACESHIP_API_KEY }}
                  SPACESHIP_API_SECRET: ${{ secrets.SPACESHIP_API_SECRET }}
                  SPACESHIP_TEST_DOMAIN: ${{ secrets.SPACESHIP_TEST_DOMAIN }}
              run: |
                  if [ -n "$SPACESHIP_API_KEY" ] && [ -n "$SPACESHIP_API_SECRET" ] && [ -n "$SPACESHIP_TEST_DOMAIN" ]; then
                      echo "has_secrets=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "has_secrets=false" >> "$GITHUB_OUTPUT"
                  fi

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              if: ${{ steps.acc_secrets.outputs.has_secrets == 'true' }}

            - name: Set up Go
              if: ${{ steps.acc_secrets.outputs.has_secrets == 'true' }}
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version-file: go.mod
                  check-latest: true

            - name: Set up Terraform
              if: ${{ steps.acc_secrets.outputs.has_secrets == 'true' }}
              uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
              with:
                  terraform_wrapper: false

            - name: Acceptance Tests
              if: ${{ steps.acc_secrets.outputs.has_secrets == 'true' }}
              env:
                  SPACESHIP_API_KEY: ${{ secrets.SPACESHIP_API_KEY }}
                  SPACESHIP_API_SECRET: ${{ secrets.SPACESHIP_API_SECRET }}
                  SPACESHIP_TEST_DOMAIN: ${{ secrets.SPACESHIP_TEST_DOMAIN }}
                  TF_ACC: 1
              run: make testacc

    # Summary job with two purposes:
    # 1. A workflow run whose jobs were ALL skipped by the gate would
    #    otherwise have no executed job, making the run-level conclusion
    #    (which gates versioning.yml via workflow_run) ambiguous. This job
    #    executes on every run that isn't cancelled, so the run always
    #    concludes success/failure. `!cancelled()` rather than `always()`:
    #    a superseded PR run cancelled by the concurrency group skips this
    #    job instead of spending a runner to post a red check on a dead SHA
    #    (checks are evaluated per-SHA, so the replacement run supplies the
    #    required check).
    # 2. Branch protection can require just this one check instead of listing
    #    every job: it fails if any needed job failed or was cancelled, and
    #    passes when jobs succeeded or were legitimately skipped by the gate.
    # Every job in this workflow must be listed in `needs` below; the first
    # step asserts that, so a job missing from the list fails this check
    # instead of silently escaping it.
    ci-ok:
        name: CI OK
        runs-on: ubuntu-latest
        needs: [changes, check, security, govulncheck, security-report, acceptance]
        if: ${{ !cancelled() }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            # "CI OK" only guards the jobs listed in its `needs`. A job added
            # to the workflow but not to that list could fail without turning
            # this check red — the exact gap this job exists to close — so
            # assert the two lists match instead of relying on the note in
            # CI.md.
            - name: Assert every job is watched by this gate
              run: |
                  watched=$(yq '.jobs.ci-ok.needs[]' .github/workflows/ci.yml | sort)
                  all=$(yq '.jobs | keys | .[]' .github/workflows/ci.yml | grep -vx 'ci-ok' | sort)
                  if ! diff <(echo "$all") <(echo "$watched"); then
                    echo "::error::ci.yml jobs and ci-ok's needs list have drifted (< missing from needs, > stale entry)."
                    exit 1
                  fi

            - name: Check results of all jobs
              env:
                  NEEDS: ${{ toJSON(needs) }}
              run: |
                  echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
                  if ! echo "$NEEDS" | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")' > /dev/null; then
                    echo "::error::One or more CI jobs failed or were cancelled — see the results above."
                    exit 1
                  fi
