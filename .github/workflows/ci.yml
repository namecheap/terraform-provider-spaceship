name: CI

# How the jobs fit together, and the invariants to keep when editing this
# file, are in CI.md.
on:
    push:
        branches:
            - master
    pull_request:

permissions:
    contents: read

jobs:
    changes:
        name: Detect Changes
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: read # paths-filter reads PR files via the API
        outputs:
            code: ${{ steps.filter-code.outputs.code }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            # `every`: a file is code unless it is root-level markdown, LICENSE
            # or the release-please manifest. Nested markdown (docs/,
            # templates/) is code.
            - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
              id: filter-code
              with:
                  predicate-quantifier: "every"
                  filters: |
                      code:
                          - '!*.md'
                          - '!LICENSE'
                          - '!.release-please-manifest.json'

    check:
        name: Check
        runs-on: ubuntu-latest
        needs: changes
        if: needs.changes.outputs.code == 'true'
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Set up Go
              uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
              with:
                  go-version-file: go.mod
                  check-latest: true

            - name: Lint
              uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
              with:
                  version: v2.11

            - name: Set up Terraform
              uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
              with:
                  terraform_wrapper: false

            - name: Unit Test with Coverage
              run: make test-cover

            # Floor for provider-only code: API logic is tested in the SDK, and
            # the record validator wrappers by acceptance tests.
            - name: Check Coverage Threshold
              run: |
                  COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
                  echo "Total coverage: ${COVERAGE}%"
                  THRESHOLD=35.0
                  if [ "$(echo "${COVERAGE} < ${THRESHOLD}" | bc -l)" -eq 1 ]; then
                      echo "::error::Coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
                      exit 1
                  fi

            - name: Upload Coverage Report
              if: always()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: coverage-report
                  path: coverage.out
                  retention-days: 30

            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
              with:
                  files: coverage.out
                  token: ${{ secrets.CODECOV_TOKEN }}
                  fail_ci_if_error: false

            # Drift (regenerate and diff) and structure (tfplugindocs validate)
            # are separate checks; tfplugindocs has no command for both.
            - name: Check docs are up-to-date and well-formed
              run: |
                  make docs
                  if ! git diff --exit-code docs/; then
                      echo "::error::docs/ is out of sync with the provider. Run 'make docs' and commit the result."
                      exit 1
                  fi
                  make docs-validate

    # Trivy and govulncheck gates plus the summary comment, from the shared
    # workflow; see CI.md.
    security:
        name: Security
        needs: changes
        if: needs.changes.outputs.code == 'true'
        permissions:
            contents: read
            pull-requests: write # sticky summary comment
            security-events: read # open CodeQL alerts for the summary
        uses: namecheap/terraform-provider-workflows/.github/workflows/security-scan.yml@6939aa96ddb124c103ac748edf490c7013c7e851 # v1.1.1
        with:
            report: true

    acceptance:
        name: Acceptance Tests
        needs: [changes, check]
        if: needs.changes.outputs.code == 'true'
        runs-on: ubuntu-latest
        concurrency:
            group: acceptance-tests
            cancel-in-progress: false
        steps:
            # Secrets can't be read in a job-level `if:`, so without them
            # (fork and Dependabot PRs) every step skips and the job passes.
            - name: Check Acceptance Secrets
              id: acc_secrets
              env:
                  SPACESHIP_API_KEY: ${{ secrets.SPACESHIP_API_KEY }}
                  SPACESHIP_API_SECRET: ${{ secrets.SPACESHIP_API_SECRET }}
                  SPACESHIP_TEST_DOMAIN: ${{ secrets.SPACESHIP_TEST_DOMAIN }}
              run: |
                  if [ -n "$SPACESHIP_API_KEY" ] && [ -n "$SPACESHIP_API_SECRET" ] && [ -n "$SPACESHIP_TEST_DOMAIN" ]; then
                      echo "has_secrets=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "has_secrets=false" >> "$GITHUB_OUTPUT"
                  fi

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              if: ${{ steps.acc_secrets.outputs.has_secrets == 'true' }}

            - name: Set up Go
              if: ${{ steps.acc_secrets.outputs.has_secrets == 'true' }}
              uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
              with:
                  go-version-file: go.mod
                  check-latest: true

            - name: Set up Terraform
              if: ${{ steps.acc_secrets.outputs.has_secrets == 'true' }}
              uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
              with:
                  terraform_wrapper: false

            - name: Acceptance Tests
              if: ${{ steps.acc_secrets.outputs.has_secrets == 'true' }}
              env:
                  SPACESHIP_API_KEY: ${{ secrets.SPACESHIP_API_KEY }}
                  SPACESHIP_API_SECRET: ${{ secrets.SPACESHIP_API_SECRET }}
                  SPACESHIP_TEST_DOMAIN: ${{ secrets.SPACESHIP_TEST_DOMAIN }}
                  TF_ACC: 1
              run: make testacc

    # The single required check; see CI.md. Every other job must be in `needs`.
    ci-ok:
        name: CI OK
        runs-on: ubuntu-latest
        needs: [changes, check, security, acceptance]
        if: ${{ !cancelled() }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Assert every job is watched by this gate
              run: |
                  watched=$(yq '.jobs.ci-ok.needs[]' .github/workflows/ci.yml | sort)
                  all=$(yq '.jobs | keys | .[]' .github/workflows/ci.yml | grep -vx 'ci-ok' | sort)
                  if ! diff <(echo "$all") <(echo "$watched"); then
                    echo "::error::ci.yml jobs and ci-ok's needs list have drifted (< missing from needs, > stale entry)."
                    exit 1
                  fi

            - name: Check results of all jobs
              env:
                  NEEDS: ${{ toJSON(needs) }}
              run: |
                  echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
                  if ! echo "$NEEDS" | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")' > /dev/null; then
                    echo "::error::One or more CI jobs failed or were cancelled — see the results above."
                    exit 1
                  fi
