name: CI

# How the jobs fit together, and the invariants to keep when editing this
# file, are in CI.md.
on:
    push:
        branches:
            - master
    pull_request:

permissions:
    contents: read

jobs:
    changes:
        name: Detect Changes
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: read # paths-filter reads PR files via the API
        outputs:
            code: ${{ steps.filter-code.outputs.code }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            # `every`: a file is code unless it is root-level markdown, LICENSE
            # or the release-please manifest. Nested markdown (docs/,
            # templates/) is code.
            - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
              id: filter-code
              with:
                  predicate-quantifier: "every"
                  filters: |
                      code:
                          - '!*.md'
                          - '!LICENSE'
                          - '!.release-please-manifest.json'

    check:
        name: Check
        runs-on: ubuntu-latest
        needs: changes
        if: needs.changes.outputs.code == 'true'
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Set up Go
              uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
              with:
                  go-version-file: go.mod
                  check-latest: true

            - name: Lint
              uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
              with:
                  version: v2.11

            - name: Set up Terraform
              uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
              with:
                  terraform_wrapper: false

            - name: Unit Test with Coverage
              run: make test-cover

            # Floor for provider-only code: API logic is tested in the SDK, and
            # the record validator wrappers by acceptance tests.
            - name: Check Coverage Threshold
              run: |
                  COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
                  echo "Total coverage: ${COVERAGE}%"
                  THRESHOLD=35.0
                  if [ "$(echo "${COVERAGE} < ${THRESHOLD}" | bc -l)" -eq 1 ]; then
                      echo "::error::Coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
                      exit 1
                  fi

            - name: Upload Coverage Report
              if: always()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: coverage-report
                  path: coverage.out
                  retention-days: 30

            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
              with:
                  files: coverage.out
                  token: ${{ secrets.CODECOV_TOKEN }}
                  fail_ci_if_error: false

            # Drift (regenerate and diff) and structure (tfplugindocs validate)
            # are separate checks; tfplugindocs has no command for both.
            - name: Check docs are up-to-date and well-formed
              run: |
                  make docs
                  if ! git diff --exit-code docs/; then
                      echo "::error::docs/ is out of sync with the provider. Run 'make docs' and commit the result."
                      exit 1
                  fi
                  make docs-validate

    security:
        name: Security scan (Trivy)
        runs-on: ubuntu-latest
        needs: changes
        if: needs.changes.outputs.code == 'true'
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            # Dependabot bumps the action, not `version:`; bump it by hand.
            # Keep it equal to the Trivy pinned in terraform-provider-workflows.
            - name: Trivy vuln + misconfig + secret + license scan
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
              with:
                  version: v0.71.2
                  scan-type: fs
                  scan-ref: .
                  scanners: vuln,misconfig,secret,license
                  severity: CRITICAL,HIGH
                  ignore-unfixed: true
                  exit-code: "1"
                  format: table
                  trivy-config: trivy.yaml
                  cache: "true"

            # All severities, never gates; feeds the security summary.
            - name: Trivy report (JSON, all severities, non-gating)
              if: ${{ !cancelled() }}
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
              with:
                  version: v0.71.2
                  scan-type: fs
                  scan-ref: .
                  scanners: vuln,misconfig,secret,license
                  exit-code: "0"
                  format: json
                  output: trivy-results.json
                  trivy-config: trivy.yaml
                  cache: "true"

            - name: Upload Trivy JSON report
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: trivy-json
                  path: trivy-results.json
                  retention-days: 90

            - name: Generate CycloneDX SBOM
              if: ${{ !cancelled() }}
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
              with:
                  version: v0.71.2
                  scan-type: fs
                  scan-ref: .
                  format: cyclonedx
                  output: sbom.cdx.json
                  cache: "true"

            - name: Upload SBOM artifact
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: sbom-cyclonedx
                  path: sbom.cdx.json
                  retention-days: 90

    govulncheck:
        name: Security scan (govulncheck)
        runs-on: ubuntu-latest
        needs: changes
        if: needs.changes.outputs.code == 'true'
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up Go
              uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
              with:
                  go-version-file: go.mod
                  check-latest: true

            # Not in go.mod, so Dependabot doesn't track it; bump by hand.
            # Fails only on vulnerabilities in called code.
            - name: Run govulncheck
              run: |
                  go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
                  govulncheck ./...

            # Never gates; feeds the security summary.
            - name: govulncheck JSON report (non-gating)
              if: ${{ !cancelled() }}
              run: |
                  GOVULNCHECK="$(go env GOPATH)/bin/govulncheck"
                  "$GOVULNCHECK" -format json ./... > govulncheck.json || true

            - name: Upload govulncheck JSON report
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: govulncheck-json
                  path: govulncheck.json
                  retention-days: 90

    # Reporting only: the gates are the security and govulncheck jobs, whose
    # results the summary shows as-is.
    security-report:
        name: Security scan summary
        needs: [changes, security, govulncheck]
        # !cancelled() alone would also run when the gate skipped the scans.
        if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: write # sticky summary comment
            security-events: read # open CodeQL alerts for the summary
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Download scan artifacts
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  path: scan-artifacts
                  merge-multiple: true

            - name: Fetch open CodeQL alerts (best effort)
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh api "repos/${GITHUB_REPOSITORY}/code-scanning/alerts?ref=${GITHUB_REF}&state=open&per_page=100" \
                      > scan-artifacts/codeql-alerts.json 2>/dev/null || echo '[]' > scan-artifacts/codeql-alerts.json

            - name: Build security summary
              env:
                  SECURITY_RESULT: ${{ needs.security.result }}
                  GOVULNCHECK_RESULT: ${{ needs.govulncheck.result }}
                  COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
                  BRANCH: ${{ github.head_ref || github.ref_name }}
              run: |
                  bash scripts/security-summary.sh \
                      scan-artifacts/trivy-results.json \
                      scan-artifacts/govulncheck.json \
                      scan-artifacts/sbom.cdx.json \
                      go.mod \
                      scan-artifacts/codeql-alerts.json \
                      > security-summary.md
                  cat security-summary.md >> "$GITHUB_STEP_SUMMARY"

            - name: Upload summary artifact
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: security-summary
                  path: security-summary.md
                  retention-days: 90

            # Same-repo PRs only: fork PRs have a read-only token.
            - name: Post or update PR comment
              if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
              env:
                  GH_TOKEN: ${{ github.token }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
              run: |
                  set -uo pipefail
                  marker='<!-- security-scan-summary -->'
                  existing="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
                                --jq "map(select(.body | startswith(\"${marker}\"))) | .[0].id // empty")"
                  jq -Rs '{body: .}' security-summary.md > comment-payload.json
                  if [ -n "${existing}" ]; then
                      gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" \
                          --input comment-payload.json >/dev/null
                      echo "Updated existing summary comment #${existing} on PR #${PR_NUMBER}."
                  else
                      gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
                          --input comment-payload.json >/dev/null
                      echo "Posted new summary comment on PR #${PR_NUMBER}."
                  fi

    acceptance:
        name: Acceptance Tests
        needs: [changes, check]
        if: needs.changes.outputs.code == 'true'
        runs-on: ubuntu-latest
        concurrency:
            group: acceptance-tests
            cancel-in-progress: false
        steps:
            # Secrets can't be read in a job-level `if:`, so without them
            # (fork and Dependabot PRs) every step skips and the job passes.
            - name: Check Acceptance Secrets
              id: acc_secrets
              env:
                  SPACESHIP_API_KEY: ${{ secrets.SPACESHIP_API_KEY }}
                  SPACESHIP_API_SECRET: ${{ secrets.SPACESHIP_API_SECRET }}
                  SPACESHIP_TEST_DOMAIN: ${{ secrets.SPACESHIP_TEST_DOMAIN }}
              run: |
                  if [ -n "$SPACESHIP_API_KEY" ] && [ -n "$SPACESHIP_API_SECRET" ] && [ -n "$SPACESHIP_TEST_DOMAIN" ]; then
                      echo "has_secrets=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "has_secrets=false" >> "$GITHUB_OUTPUT"
                  fi

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              if: ${{ steps.acc_secrets.outputs.has_secrets == 'true' }}

            - name: Set up Go
              if: ${{ steps.acc_secrets.outputs.has_secrets == 'true' }}
              uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
              with:
                  go-version-file: go.mod
                  check-latest: true

            - name: Set up Terraform
              if: ${{ steps.acc_secrets.outputs.has_secrets == 'true' }}
              uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
              with:
                  terraform_wrapper: false

            - name: Acceptance Tests
              if: ${{ steps.acc_secrets.outputs.has_secrets == 'true' }}
              env:
                  SPACESHIP_API_KEY: ${{ secrets.SPACESHIP_API_KEY }}
                  SPACESHIP_API_SECRET: ${{ secrets.SPACESHIP_API_SECRET }}
                  SPACESHIP_TEST_DOMAIN: ${{ secrets.SPACESHIP_TEST_DOMAIN }}
                  TF_ACC: 1
              run: make testacc

    # The single required check; see CI.md. Every other job must be in `needs`.
    ci-ok:
        name: CI OK
        runs-on: ubuntu-latest
        needs: [changes, check, security, govulncheck, security-report, acceptance]
        if: ${{ !cancelled() }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Assert every job is watched by this gate
              run: |
                  watched=$(yq '.jobs.ci-ok.needs[]' .github/workflows/ci.yml | sort)
                  all=$(yq '.jobs | keys | .[]' .github/workflows/ci.yml | grep -vx 'ci-ok' | sort)
                  if ! diff <(echo "$all") <(echo "$watched"); then
                    echo "::error::ci.yml jobs and ci-ok's needs list have drifted (< missing from needs, > stale entry)."
                    exit 1
                  fi

            - name: Check results of all jobs
              env:
                  NEEDS: ${{ toJSON(needs) }}
              run: |
                  echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
                  if ! echo "$NEEDS" | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")' > /dev/null; then
                    echo "::error::One or more CI jobs failed or were cancelled — see the results above."
                    exit 1
                  fi
